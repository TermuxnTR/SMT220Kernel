name: SMT220 Kernel Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Conda & Python 2.7
        uses: s-weigand/setup-conda@v1
        with:
          python-version: 2.7

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev wget xz-utils

      - name: Download and Setup Linaro GCC 7.5
        run: |
          wget https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          mv gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu toolchain
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Surgical Patches (Hata Odaklı Düzenleme)
        run: |
          # 1. İlk Hata: Sched (kernel/sched/sched.h)
          sed -i 's/inline void uclamp_se_set/void uclamp_se_set/g' kernel/sched/sched.h
          
          # 2. İkinci Hata: Blk-Crypto (include/linux/blk-crypto.h)
          sed -i 's/inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h
          
          # 3. Üçüncü Hata: Keyslot Manager (include/linux/keyslot-manager.h)
          # Tam olarak belirttiğin o satırı düzeltiyoruz:
          sed -i 's/inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h
          
          echo "Hocam üç inatçı dosya da el ile düzeltildi, yola devam!"

      - name: Build Kernel
        run: |
          mkdir -p out
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gta7litewifi_defconfig
          
          # Derlemeyi başlat (KCFLAGS="-w" ile sadece görsel kalabalığı engelliyoruz)
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w"

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: SMT220-Kernel
          path: out/arch/arm64/boot/
