name: SMT220 Kernel Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 2
        uses: actions/setup-python@v5
        with:
          python-version: '2.7'

      - name: Install Old GCC and Tools
        run: |
          sudo apt-get update
          # GCC 9 ve gerekli araçları kuruyoruz (Daha toleranslıdır)
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-9-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          mkdir -p out
          sudo ln -sf $(which python2.7) /usr/bin/python
          
          export ARCH=arm64
          # Derleyici olarak özellikle daha eski olan GCC 9'u işaret ediyoruz
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gta7litewifi_defconfig
          
          # Derlemeyi başlat (Hem uyarıları kapat hem de hata toleransını artır)
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w -fno-pie"

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: SMT220-Kernel
          path: out/arch/arm64/boot/
