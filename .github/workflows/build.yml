name: SMT220 Kernel Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Conda & Python 2.7
        uses: s-weigand/setup-conda@v1
        with:
          python-version: 2.7

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev wget xz-utils

      - name: Download and Setup Linaro GCC 7.5
        run: |
          wget https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          mv gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu toolchain
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Surgical Patches (Hata Odaklı Düzenleme)
        run: |
          sed -i 's/inline void uclamp_se_set/void uclamp_se_set/g' kernel/sched/sched.h
          sed -i 's/inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h
          sed -i 's/inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h
          echo "Hocam üç inatçı dosya da el ile düzeltildi, yola devam!"

      - name: Build Kernel with KVM & DTBs
        run: |
          mkdir -p out
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. Defconfig oluştur
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gta7litewifi_defconfig
          
          # 2. KVM ve EL2 Ayarlarını Enjekte Et (Şalterler açılıyor)
          echo "CONFIG_VIRTUALIZATION=y" >> out/.config
          echo "CONFIG_KVM=y" >> out/.config
          echo "CONFIG_KVM_ARM_HOST=y" >> out/.config
          echo "CONFIG_KVM_MMIO=y" >> out/.config
          echo "CONFIG_ARM64_V8_2_LVA=y" >> out/.config
          echo "CONFIG_ARM64_PA_BITS_48=y" >> out/.config
          
          # 3. Ayarları doğrula ve bağımlılıkları çöz
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # 4. Kernel ve DTB'leri birlikte derle
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w" Image.gz dtbs

      - name: Merge Image and DTB (Wi-Fi Fix)
        run: |
          # Wi-Fi için Image.gz ve derlenen tüm DTB'leri 'cat' ile birleştiriyoruz
          # Mediatek klasöründeki tüm dtb'leri kernelin sonuna ekler
          cat out/arch/arm64/boot/Image out/arch/arm64/boot/dts/mediatek/*.dtb > out/arch/arm64/boot/Image-final
          echo "Hocam Image ve DTB'ler başarıyla kaynatıldı!"

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: SMT220-Kernel-Final
          path: out/arch/arm64/boot/Image-final
