name: SMT220 Kernel Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python 2 from Archive
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential wget flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu
          
          # Senin bulduğun arşivden gerekli paketleri indiriyoruz
          wget http://archive.ubuntu.com/ubuntu/pool/universe/p/python2.7/libpython2.7-minimal_2.7.18-1~20.04.7_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/p/python2.7/python2.7-minimal_2.7.18-1~20.04.7_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/p/python2.7/libpython2.7-stdlib_2.7.18-1~20.04.7_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/p/python2.7/python2.7_2.7.18-1~20.04.7_amd64.deb
          
          # Paketleri sırayla kuruyoruz
          sudo dpkg -i libpython2.7-minimal_2.7.18-1~20.04.7_amd64.deb
          sudo dpkg -i python2.7-minimal_2.7.18-1~20.04.7_amd64.deb
          sudo dpkg -i libpython2.7-stdlib_2.7.18-1~20.04.7_amd64.deb
          sudo dpkg -i python2.7_2.7.18-1~20.04.7_amd64.deb
          
          # Python komutunu tanımla
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          python --version

      - name: Build Kernel
        run: |
          mkdir -p out
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gta7litewifi_defconfig
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: SMT220-Kernel
          path: out/arch/arm64/boot/
